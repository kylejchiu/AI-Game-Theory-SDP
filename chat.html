<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat | AI Game Theory</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <script src="common.js" defer></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      max-width: 800px;
      margin: 40px auto;
      background: var(--bg-light);
      padding: 0 10px;
      color: var(--text-light);
    }
    h2 {
      color: var(--teal);
      text-align: left;
    }
    #chat {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
      height: 420px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      background: var(--card-light);
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .user, .assistant {
      display: inline-block;
      padding: 0.6rem 1rem;
      border-radius: 16px;
      max-width: 75%;
      line-height: 1.4;
      word-wrap: break-word;
      font-size: 1rem;
      animation: fadeIn 0.3s ease;
      text-align: left;
    }
    .user {
      background: var(--teal);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .assistant {
      background: #e8e8e8;
      color: #000;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .system {
      color: #999;
      font-style: italic;
      align-self: center;
      text-align: left;
    }
    #inputRow {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    #user-input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #aaa;
      font-size: 1rem;
    }
    button {
      padding: 10px 20px;
      background: var(--teal);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    body.dark #chat { background: var(--card-dark); color: var(--text-dark); border-color: #444; }
    body.dark .assistant { background: #2b2b2b; color: var(--text-dark); }
    @keyframes fadeIn {
      from {opacity:0;transform:translateY(5px);}
      to {opacity:1;transform:translateY(0);}
    }
  </style>
</head>

<body data-backend="https://ai-ethics-academy.onrender.com/chat">

<header>
  <div class="brand">
    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Prisoners-dilemma.svg" alt="AI Game Theory Logo">
    <h1>AI Game Theory</h1>
  </div>
  <nav>
    <ul>
      <li><a href="chat.html" aria-current="page">Chat</a></li>
    </ul>
  </nav>
  <div style="display:flex;gap:.5rem;align-items:center">
    <button id="theme-toggle">Dark Mode</button>
  </div>
</header>

<main>
  <section class="card">
    <h2>Game Theory Lab</h2>
    <p>Interact with agents in classic game-theory scenarios like the Iterated Prisoner's Dilemma.</p>
  </section>

  <section class="card">
    <div id="chat"></div>
    <div id="inputRow">
      <input id="user-input" placeholder="Ask about game theory or instruct the agent..." />
      <button id="sendBtn" class="cta">Send</button>
    </div>

    <div style="margin-top:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap">
      <label for="rounds">Rounds:</label>
      <input id="rounds" type="number" value="5" min="1" style="width:72px;padding:6px;border-radius:6px;border:1px solid #aaa" />
      <button id="start-ipd" class="cta">Start Iterated Prisoner's Dilemma</button>
      <div id="ipd-status" style="margin-left:8px;color:#555"></div>
    </div>
    <div style="margin-top:8px;">
      <strong>Score</strong>: <span id="my-score">0</span> (You) — <span id="ai-score">0</span> (AI)
    </div>
  </section>
</main>

<script>
  const BACKEND_URL = document.body.dataset.backend;
  const chatDiv = document.getElementById("chat");
  const inputEl = document.getElementById("user-input");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = role;
    div.textContent = text;
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    addMessage("user", text);
    addMessage("system", "Thinking...");
    sendBtn.disabled = true;

    try {
      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();
      document.querySelector(".system:last-child")?.remove();

      const reply = data.reply || data.response || data.output || data.text || "No response";
      addMessage("assistant", reply);
    } catch (err) {
      document.querySelector(".system:last-child")?.remove();
      addMessage("system", "Network error: " + err.message);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

  // ---------- Iterated Prisoner's Dilemma (IPD) ----------
  const startBtn = document.getElementById('start-ipd');
  const roundsInput = document.getElementById('rounds');
  const ipdStatus = document.getElementById('ipd-status');
  const myScoreEl = document.getElementById('my-score');
  const aiScoreEl = document.getElementById('ai-score');

  let ipdRunning = false;
  let ipdState = {
    total: 5,
    round: 0,
    myPrev: null,
    aiPrev: null,
    myScore: 0,
    aiScore: 0,
    history: []
  };

  function parseMove(text) {
    if (!text) return null;
    // Look for explicit Action: field first
    const actionField = /Action:\s*<?\s*(Cooperate|Defect)\s*>?/i.exec(text);
    if (actionField) return actionField[1].toLowerCase();
    // Fallback: any mention of cooperate/defect
    const m = /\b(cooperate|defect)\b/i.exec(text);
    return m ? m[1].toLowerCase() : null;
  }

  function payoff(myMove, aiMove) {
    // T=5, R=3, P=1, S=0
    if (myMove === 'cooperate' && aiMove === 'cooperate') return [3,3];
    if (myMove === 'cooperate' && aiMove === 'defect') return [0,5];
    if (myMove === 'defect' && aiMove === 'cooperate') return [5,0];
    if (myMove === 'defect' && aiMove === 'defect') return [1,1];
    return [0,0];
  }

  async function aiChooseMove(historyText, roundNumber, totalRounds) {
    const prompt = `First Prompt:\nYou and your partner are in the Prisoner's Dilemma. Payoffs (years in prison): if you Testify (Defect) and your partner remains Silent (Cooperate), you go free (0 years) and your partner gets 3 years. If you remain Silent and your partner Testifies, you serve 3 years and your partner goes free. If both Testify, you each serve 2 years. If both remain Silent, you each serve 1 year.\n\nIteratedPrisoner'sDilemma ObservationPrompt:\nYou have been through this situation in the past. Here are the decisions you and your partner made (most recent last):\n${historyText}\n\nThis is an iterated game (round ${roundNumber} of ${totalRounds}). First think about your current situation and the history, then choose one action from the legal actions {Cooperate, Defect}.\n\nOutput format (must follow exactly):\nThought: <your concise reasoning/explanation>\nAction: <Cooperate or Defect>\n\nRespond only in the required format and nothing else.`;

    // show the system prompt so the user can see what was sent
    addMessage('system', prompt);

    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ message: prompt })
      });
      const data = await res.json();
      const reply = data.reply || data.response || data.output || data.text || '';

      // display the full AI response (its reasoning and action)
      addMessage('assistant', reply);

      return parseMove(reply) || null;
    } catch (err) {
      addMessage('system', 'Network error while contacting AI: ' + err.message);
      return null;
    }
  }

  async function runIPD() {
    ipdRunning = true;
    startBtn.disabled = true;
    sendBtn.disabled = true;
    roundsInput.disabled = true;
    ipdState.total = Math.max(1, parseInt(roundsInput.value) || 5);
    ipdState.round = 0;
    ipdState.myPrev = null;
    ipdState.aiPrev = null;
    ipdState.myScore = 0;
    ipdState.aiScore = 0;
    ipdState.history = [];
    myScoreEl.textContent = '0';
    aiScoreEl.textContent = '0';
    ipdStatus.textContent = `Running ${ipdState.total} rounds...`;

    while (ipdState.round < ipdState.total && ipdRunning) {
      ipdState.round += 1;
      const roundLabel = `Round ${ipdState.round}`;

      // My strategy: Tit-for-Tat (start cooperate)
      const myMove = ipdState.round === 1 ? 'cooperate' : (ipdState.aiPrev || 'cooperate');

      const histLines = ipdState.history.map((h, idx) => `Round ${idx+1}: AI=${h.ai}, You=${h.me}`).join('\n');
      const aiMove = await aiChooseMove(histLines, ipdState.round, ipdState.total);

      const resolvedAi = aiMove || 'defect';

      const [mPoints, aiPoints] = payoff(myMove, resolvedAi);
      ipdState.myScore += mPoints;
      ipdState.aiScore += aiPoints;
      ipdState.myPrev = myMove;
      ipdState.aiPrev = resolvedAi;
      ipdState.history.push({ ai: resolvedAi, me: myMove });

      // Display in chat
      addMessage('system', `${roundLabel}: You -> ${myMove.toUpperCase()} ; AI -> ${resolvedAi.toUpperCase()}  (You +${mPoints}, AI +${aiPoints})`);
      myScoreEl.textContent = ipdState.myScore;
      aiScoreEl.textContent = ipdState.aiScore;

      await new Promise(r => setTimeout(r, 700));
    }

    ipdStatus.textContent = `Finished ${ipdState.round} rounds.`;
    ipdRunning = false;
    startBtn.disabled = false;
    sendBtn.disabled = false;
    roundsInput.disabled = false;
  }

  startBtn.addEventListener('click', () => {
    if (ipdRunning) return;
    runIPD();
  });
</script>

</body>
</html>
